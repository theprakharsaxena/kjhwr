version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windscope-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ELEXON_API_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - CACHE_TTL_SECONDS=86400
      - CORS_ORIGINS=["*"]
    volumes:
      - backend-cache:/app/data_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windscope-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-cache:
